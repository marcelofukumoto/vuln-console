# The gates, on every push and pull request: the bundle has to build, and the code has to pass
# lint and the type checker before it does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn type-check
      # The in-pod scripts are written into the agent pod from seed.generated.ts and a
      # workspace is rendered from yaml.generated.ts, so an edit under seed/ or yaml/ that was
      # not regenerated is an edit that never reaches the cluster. Regenerating here and checking
      # for a diff is what catches that.
      #
      # Name the files explicitly and let the diff cover the whole package: this check spent its
      # first few commits pointed at a path that did not exist, where `git diff --exit-code` on
      # nothing is a pass.
      - name: generated files are up to date
        run: |
          test -f pkg/vuln-console/seed.generated.ts
          test -f pkg/vuln-console/yaml.generated.ts
          yarn gen-seed
          git diff --exit-code -- pkg/vuln-console \
            || { echo "::error::generated files are stale - run 'yarn gen-seed' and commit them"; exit 1; }
      - run: yarn build-pkg vuln-console
