# The scripts the workspace pod runs, mounted rather than baked into an image.
#
# No image is ever built for any of this: a stock `node:24` reads its whole behaviour out of
# this ConfigMap. Editing a script is editing this object, and the pod picks it up on its next
# start - which is why the Deployment carries a hash of these in its pod template.
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: ${namespace}
  name: vuln-workspace-config
data:
  boot.sh: |
    @@include:seed/workspace/boot.sh@@
  checkout.sh: |
    @@include:seed/workspace/checkout.sh@@
  serve.sh: |
    @@include:seed/workspace/serve.sh@@
  vue.config.js: |
    @@include:seed/workspace/vue.config.js@@
  browser.mjs: |
    @@include:seed/workspace/browser.mjs@@
  rancher-login.mjs: |
    @@include:seed/workspace/rancher-login.mjs@@
  wait-for-sidecars: |
    @@include:seed/workspace/wait-for-sidecars@@
  commit-msg: |
    @@include:seed/workspace/commit-msg@@
